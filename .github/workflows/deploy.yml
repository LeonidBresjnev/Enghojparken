name: Build, Test and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Firebase secrets configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.apiKey || secrets.APIKEY || secrets.API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.authDomain || secrets.AUTHDOMAIN || secrets.AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.projectId || secrets.PROJECTID || secrets.PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.storageBucket || secrets.STORAGEBUCKET || secrets.STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.messagingSenderId || secrets.MESSAGINGSENDERID || secrets.MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.appId || secrets.APPID || secrets.APP_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const secrets = {
              apiKey: process.env.FIREBASE_API_KEY || '',
              authDomain: process.env.FIREBASE_AUTH_DOMAIN || '',
              projectId: process.env.FIREBASE_PROJECT_ID || '',
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET || '',
              messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID || '',
              appId: process.env.FIREBASE_APP_ID || ''
            };
            const content = 'export const firebaseConfig = ' + JSON.stringify(secrets, null, 2) + ';\n\nexport default firebaseConfig;\n';
            fs.writeFileSync('src/secrets.js', content, 'utf8');
          "

      - name: Run unit & integration tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
